name: Render Shorts

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        script:
          - script_rocket_fire
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Python deps
        run: pip install edge-tts

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Fetch background images
        run: python tools/fetch_assets.py tools/${{ matrix.script }}.json

      - name: Build story
        run: python tools/build_story.py tools/${{ matrix.script }}.json

      - name: Render Story
        run: npx remotion render Story out/${{ matrix.script }}.mp4 --gl=swangle --concurrency=4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.script }}-video
          path: out/${{ matrix.script }}.mp4

  package:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - name: Download all videos
        uses: actions/download-artifact@v4
        with:
          path: videos
          merge-multiple: true

      - name: Create single zip
        run: zip -r all-shorts.zip videos

      - name: Upload combined zip
        uses: actions/upload-artifact@v4
        with:
          name: all-shorts
          path: all-shorts.zip
