name: Render Shorts (Sharded)

# EXPERIMENT - ONE build, then 4 frame ranges rendered on separate runners and
# stitched with ffmpeg. The base workflow (render.yml) is untouched.
# To roll back completely, just delete this file.
#
# IMPORTANT: the TTS voice, word timings and photos must be generated exactly
# once. If each shard builds its own story, the four parts have different
# narration and images and the joined video visibly changes every part.

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: 'Remotion --concurrency per job'
        required: false
        default: '4'
        type: choice
        options:
          - '2'
          - '4'
          - '8'

env:
  SCRIPT: script_rocket_fire
  FPS: '30'
  SHARDS: '4'

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Python deps
        run: pip install edge-tts

      - name: Fetch background images
        run: python tools/fetch_assets.py tools/${{ env.SCRIPT }}.json

      - name: Build story
        run: python tools/build_story.py tools/${{ env.SCRIPT }}.json

      - name: Check prepared story
        run: |
          python - <<'PY'
          import json
          d = json.load(open('public/story.json'))
          print('PREPARED totalSec:', d['totalSec'])
          print('PREPARED photos:', sum(len(s.get('photos', [])) for s in d['scenes']))
          print('PREPARED narration:', d['narration'])
          PY

      - name: Share one build with all shards
        uses: actions/upload-artifact@v4
        with:
          name: prepared-public
          path: public/
          retention-days: 1
          if-no-files-found: error

  render:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Download the single prepared build
        uses: actions/download-artifact@v4
        with:
          name: prepared-public
          path: public

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compute frame range for part ${{ matrix.part }}
        id: range
        env:
          PART: ${{ matrix.part }}
        run: |
          python - <<'PY'
          import json, os
          total = round(json.load(open('public/story.json'))['totalSec'] * int(os.environ['FPS']))
          shards = int(os.environ['SHARDS'])
          i = int(os.environ['PART'])
          start = total * i // shards
          end = total * (i + 1) // shards - 1
          print(f'part {i}: frames {start}-{end} (of 0-{total-1}, total {total})')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'start={start}\n')
              f.write(f'end={end}\n')
          PY

      - name: Render part ${{ matrix.part }}
        env:
          CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          t0=$(date +%s)
          npx remotion render StoryFlow out/part_${{ matrix.part }}.mp4 \
            --frames=${{ steps.range.outputs.start }}-${{ steps.range.outputs.end }} \
            --gl=swangle --concurrency=${CONCURRENCY} --log=error
          dt=$(( $(date +%s) - t0 ))
          echo "PART ${{ matrix.part }} RENDER SECONDS: ${dt}"
          echo "RENDER_SECONDS=${dt}" >> "$GITHUB_ENV"

      - name: Upload part ${{ matrix.part }}
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.part }}
          path: out/part_${{ matrix.part }}.mp4
          retention-days: 1
          if-no-files-found: error

  merge:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - name: Install ffmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -1
            exit 0
          fi
          # apt-get update is what stalls for minutes on some runners. The
          # package index is already present, so install directly and fall back
          # to a bundled ffmpeg wheel if apt is unavailable.
          if ! timeout 150 sudo apt-get install -y --no-install-recommends ffmpeg; then
            echo "apt failed - using bundled ffmpeg from pip"
            pip install --quiet imageio-ffmpeg
            echo "FF=$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" >> "$GITHUB_ENV"
          fi
          ${FF:-ffmpeg} -version | head -1

      - name: Download all parts
        uses: actions/download-artifact@v4
        with:
          pattern: part-*
          merge-multiple: true
          path: parts

      - name: Stitch parts
        run: |
          mkdir -p out
          : > list.txt
          for i in 0 1 2 3; do echo "file 'parts/part_${i}.mp4'" >> list.txt; done
          cat list.txt
          t0=$(date +%s)
          ${FF:-ffmpeg} -y -f concat -safe 0 -i list.txt \
            -c:v libx264 -preset veryfast -crf 18 \
            -c:a aac -b:a 192k -movflags +faststart \
            out/${SCRIPT}_sharded.mp4
          echo "STITCH SECONDS: $(( $(date +%s) - t0 ))"

      - name: Verify output
        run: |
          ls -la out/
          test -s out/${SCRIPT}_sharded.mp4
          ${FF:-ffmpeg} -v error -i out/${SCRIPT}_sharded.mp4 -f null - 2>&1 | head -5

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: script_rocket_fire-sharded
          path: out/script_rocket_fire_sharded.mp4
          if-no-files-found: error
